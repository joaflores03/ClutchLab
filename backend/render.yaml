services:
  - type: web
    name: clutchlab-api
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.api:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false # El valor se configurará manualmente en el dashboard de Render
      - key: GROQ_API_KEY
        sync: false # El valor se configurará manualmente en el dashboard de Render
      - key: SECRET_KEY
        sync: false # El valor se configurará manualmente en el dashboard de Render